name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install build tools
        run: python -m pip install --upgrade pip build pytest twine

      - name: Install project
        run: python -m pip install -e .

      - name: Run core tests
        run: pytest tests/test_timeline.py tests/test_srt_exporter.py tests/test_lrc_exporter.py

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*